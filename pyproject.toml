[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastqwenjudge"
version = "0.1.0"
description = "Fast, frontier-verified checklist judging of generated images with Qwen3-VL-32B on vLLM"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Mohammed Abdulrahman" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["vllm>=0.32"]
hf = ["torch>=2.4", "transformers>=4.57", "accelerate", "pillow"]
plots = ["matplotlib>=3.8"]

[project.scripts]
fastqwenjudge = "fastqwenjudge.cli:main"

# opt-in (FQJ_FUSED_KERNELS=1): Qwen3-VL decoder layers with fused norm/SiLU + FP8 kernels, see kernels/qwen3vl.py
[project.entry-points."vllm.general_plugins"]
fastqwenjudge_fused_kernels = "fastqwenjudge.kernels.qwen3vl:register"

[tool.hatch.build.targets.wheel]
packages = ["src/fastqwenjudge"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
