<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 596" width="1280" height="596" role="img" aria-label="One judge request through FastQwenJudge and vLLM, with each change from vLLM's defaults and its measured gain" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect width="1280" height="596" fill="#fcfcfb"/><text x="24" y="36" font-size="18" font-weight="bold" fill="#0b0b0b" text-anchor="start">One judge request, end to end</text><text x="24" y="60" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">Orange: what changed from vLLM's defaults, and what each change measured on its own (fast mode: images per second; quality mode: batch time).</text><rect x="24" y="210" width="132" height="84" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="36" y="232" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">items.jsonl</text><text x="36" y="252" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">image, prompt,</text><text x="36" y="270" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">checklist</text><rect x="24" y="346" width="132" height="102" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="36" y="368" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">results.jsonl</text><text x="36" y="388" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">a verdict and</text><text x="36" y="406" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">evidence per</text><text x="36" y="424" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">requirement</text><rect x="186" y="150" width="222" height="320" rx="6" fill="#f3f2ef" stroke="#b9b7b1" stroke-width="1.2"/><text x="200" y="174" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">fastqwenjudge</text><text x="200" y="192" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">one Python process</text><rect x="200" y="206" width="194" height="90" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="212" y="228" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">runner</text><text x="212" y="248" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">one task per image,</text><text x="212" y="266" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">results appended</text><rect x="200" y="318" width="194" height="138" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="212" y="340" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">client</text><text x="212" y="360" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">≤ 256 requests in flight,</text><text x="212" y="378" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">retries with a correction</text><text x="212" y="396" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">one server per GPU,</text><text x="212" y="414" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">prefix-aware routing;</text><text x="212" y="432" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">4 GPUs: 13.1 images/s</text><path d="M156,250 L200,250" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M200,280 L176,280 L176,397 L156,397" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M297,296 L297,318" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="440" y="96" width="816" height="476" rx="6" fill="#f3f2ef" stroke="#b9b7b1" stroke-width="1.2"/><text x="456" y="122" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">vLLM 0.32 server</text><text x="580" y="122" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">one per H100</text><rect x="456" y="318" width="140" height="104" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="468" y="340" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">API process</text><text x="468" y="360" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">chat template,</text><text x="468" y="378" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">image to patches,</text><text x="468" y="396" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">tokenizer (CPU)</text><path d="M394,370 L456,370" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="416" y="362" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="middle">HTTP</text><rect x="640" y="140" width="236" height="416" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="652" y="162" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">engine</text><text x="652" y="182" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">continuous batching,</text><text x="652" y="200" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">prefix cache,</text><text x="652" y="218" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">JSON schema on answers</text><rect x="652" y="236" width="212" height="70" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="664" y="258" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">memory</text><text x="664" y="278" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">tuned server: 1.46x</text><text x="664" y="296" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">KV cache 20k to 42k tokens</text><rect x="652" y="318" width="212" height="88" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="664" y="340" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">n-gram drafts on GPU</text><text x="664" y="360" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">only while ≤ 96 run (fast)</text><text x="664" y="378" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">or ≤ 16 run (quality)</text><text x="664" y="396" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">1,000 images: 424 to 383 s</text><rect x="652" y="418" width="212" height="124" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="664" y="440" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">thinking budget</text><text x="664" y="460" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">8,192 tokens (quality)</text><text x="664" y="478" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">a looping chain stops</text><text x="664" y="496" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">and the model answers;</text><text x="664" y="514" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">reasoning batch: 641 to 530 s</text><path d="M596,370 L640,370" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="930" y="140" width="310" height="416" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="942" y="162" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">H100 80 GB</text><text x="942" y="182" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">Qwen3-VL-32B, Qwen's FP8 checkpoints</text><text x="942" y="200" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">quality mode: 484 to 230 s</text><rect x="944" y="210" width="282" height="62" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="956" y="232" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">vision encoder + merger</text><text x="956" y="252" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">kept in BF16 by the checkpoint</text><path d="M1085,272 L1085,288" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="944" y="288" width="282" height="112" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="956" y="310" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">64 decoder layers</text><text x="956" y="330" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">FP8 weights, 128 x 128 blocks: 2.44x</text><text x="956" y="348" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">FlashInfer attention: 1.14x</text><text x="956" y="366" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">fused RMSNorm / SiLU + FP8 quant</text><text x="956" y="384" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">(fast mode, Triton): 1.01x</text><rect x="944" y="412" width="282" height="60" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="956" y="434" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">KV cache</text><text x="956" y="454" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">FP8: 1.36x, 256 requests fit</text><rect x="944" y="484" width="282" height="60" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="956" y="506" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">output layer</text><text x="956" y="526" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">FP8 (fast mode): 1.01x</text><path d="M876,330 L930,330" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="903" y="322" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="middle">batch</text><path d="M930,362 L876,362" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="903" y="380" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="middle">tokens</text></svg>