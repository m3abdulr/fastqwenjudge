<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="The two judges: the fast judge's image request sees only neutral questions; the quality judge sees everything in one request" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect width="1280" height="520" fill="#fcfcfb"/><text x="24" y="36" font-size="18" font-weight="bold" fill="#0b0b0b" text-anchor="start">Two judges, one output</text><text x="24" y="60" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">Which inputs each request sees. The fast judge's image request never sees a requirement, and the expected values skip the model entirely.</text><text x="24" y="104" font-size="15" font-weight="bold" fill="#0b0b0b" text-anchor="start">fast</text><text x="24" y="122" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">Qwen3-VL-32B-Instruct, 3 requests per image</text><rect x="24" y="150" width="120" height="50" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="36" y="172" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">checklist</text><rect x="200" y="140" width="200" height="92" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="212" y="162" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">compile</text><text x="212" y="182" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">text only,</text><text x="212" y="200" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">once per checklist</text><rect x="520" y="140" width="200" height="92" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="532" y="162" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">observe</text><text x="532" y="182" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">image + questions only</text><text x="532" y="200" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">evidence, counts, unsure</text><rect x="820" y="140" width="200" height="92" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="832" y="162" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">decide</text><text x="832" y="182" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">text only: requirements</text><text x="832" y="200" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">+ observations</text><rect x="1090" y="140" width="166" height="92" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="1102" y="162" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">guards</text><text x="1102" y="182" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">code: a definite count,</text><text x="1102" y="200" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">absence or 'every'</text><text x="1102" y="218" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">can fail a pass</text><rect x="560" y="270" width="120" height="46" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="572" y="292" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">image</text><path d="M144,175 L200,175" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M400,175 L520,175" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="460" y="167" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="middle">neutral questions</text><path d="M720,175 L820,175" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="770" y="167" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="middle">observations</text><path d="M1020,175 L1090,175" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="1055" y="167" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="middle">verdicts</text><path d="M620,270 L620,232" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M84,200 L84,346 L920,346 L920,232" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="500" y="338" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="middle">requirements</text><path d="M300,140 L300,116 L1173,116 L1173,140" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="736" y="108" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="middle">expected values, set aside</text><text x="24" y="398" font-size="15" font-weight="bold" fill="#0b0b0b" text-anchor="start">quality</text><text x="24" y="416" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">Qwen3-VL-32B-Thinking, 1 request per image</text><rect x="24" y="432" width="120" height="70" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="36" y="454" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">inputs</text><text x="36" y="474" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">image, prompt,</text><text x="36" y="492" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">checklist</text><rect x="200" y="432" width="820" height="70" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="212" y="454" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">one request: reason, then answer</text><text x="212" y="474" font-size="12.5" font-weight="bold" fill="#eb6834" text-anchor="start">sees everything at once; the reasoning ends at 8,192 tokens (thinking budget)</text><rect x="1090" y="432" width="166" height="70" rx="6" fill="#ffffff" stroke="#b9b7b1" stroke-width="1.2"/><text x="1102" y="454" font-size="13.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">verdicts</text><text x="1102" y="474" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">same JSON as fast</text><path d="M144,467 L200,467" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M1020,467 L1090,467" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/></svg>