# 27B serving ladder, part Q3 (one H100): the fusions on DeepGEMM, steady-state pairs only (batches only if they gain).
# Parts Q, Q2 (27B) and L, L2 (Flash-Next) were all started after the answer schema got a 4,000-character maxLength on
# each evidence string (13:31): with any maxLength, xgrammar 0.2.8 builds each token's mask ~10x slower (224 against
# 21 us a token, CPU), and the GPUs waited on it (65-90% busy instead of ~100%). Not node contention, as first
# thought. The bound is gone (prompts.VERDICTS as before); these numbers are void.
# Every rung here also sets the three-pass top-k / top-p mask (FQJ_TOPK_TOPP=1, part O, now in the
# profile), so the fusion is measured on top of the package's settings. From part Q: part P's fused server traced the
# same graph as the kept one: the 27B's FP8 matmuls go through torch.ops.vllm.dynamic_flashinfer_deepgemm_blockscale_gemm,
# one opaque op that quantizes its input inside (DeepGEMM at 32+ rows, FlashInfer's swapAB kernel below), so the
# passes found no rms_norm -> per_token_group_fp8_quant pair to fuse (part P: +0.3% / +1%, noise; cancelled after its
# first pairs). VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER=0 selects vLLM's DeepGEMM kernel, which quantizes with the
# QuantFP8 op in the graph, where rms_quant_fusion.py and act_quant_fusion.py have patterns for group 128 (column-major
# and TMA-aligned scales included). "nofi" alone separates the kernel switch from the fusion. Steady state at 192 in
# flight, then batches of the 600 for time and verdict flips; kept and nofi_fused twice, alternating.
# Result (GPU 100% busy): steady fast / quality images/s kept 5.94 / 3.05 and 5.95 / 3.24, nofi
# 5.72 / 3.00, nofi_fused 5.74 / 3.16 and 5.71 / 3.08: the DeepGEMM-only path is 3% slower on fast and the fusion does
# not win it back. Not kept.
profile: 27b
data: q38_dev600.jsonl
judges: [off_greedy_strict, think_medium_strict]
rungs:
  - name: steady_kept
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
    env: {FQJ_TOPK_TOPP: 1}
  - name: steady_nofi
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
    env: {VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0, FQJ_TOPK_TOPP: 1}
  - name: steady_nofi_fused
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
    env: {VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0, FQJ_TOPK_TOPP: 1}
    set: {compilation-config: {"custom_ops": ["+rms_norm", "+silu_and_mul"], "pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}}}
  - name: steady_kept_again
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
    env: {FQJ_TOPK_TOPP: 1}
  - name: steady_nofi_fused_again
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
    env: {VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0, FQJ_TOPK_TOPP: 1}
    set: {compilation-config: {"custom_ops": ["+rms_norm", "+silu_and_mul"], "pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}}}
