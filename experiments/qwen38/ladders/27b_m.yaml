# Not in the package: kernels/topk_first.py (dropped); the three-pass mask of part O replaced it. Correction
# (2026-10-31): the 11% below came from an 8-s profile; over a whole batch it was 7.8 s of 166 (about 5%).
# 27B serving ladder, part M (one H100): top-k first sampling masks (kernels/topk_first.py, FQJ_TOPK_FIRST=1). In the
# thinking profile vLLM's Triton top-k / top-p kernel took 2.2-3.0 ms per call (11% of the GPU time; its threshold
# search depends on the logits); top-k first takes the 64 largest logits once (1.3 ms on synthetic logits where
# vLLM's took 0.6) and keeps the same tokens. Quality mode only (the fast mode is greedy), each twice.
profile: 27b
data: q38_dev600.jsonl
judges: [think_medium_strict]
rungs:
  - name: kept
    objective: makespan
  - name: topk_first
    objective: makespan
    env: {FQJ_TOPK_FIRST: 1}
  - name: kept_again
    objective: makespan
  - name: topk_first_again
    objective: makespan
    env: {FQJ_TOPK_FIRST: 1}
