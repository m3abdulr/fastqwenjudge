# VOID (2026-10-31): started after the answer schema's evidence maxLength, which made xgrammar ~10x slower and left the
# GPU waiting (not node contention, as this header may say); see 27b_q3.yaml / flash_l3.yaml.
# 27B serving ladder, part Q (one H100): part P again with the fusions able to match. Part P's fused server traced the
# same graph as the kept one: the 27B's FP8 matmuls go through torch.ops.vllm.dynamic_flashinfer_deepgemm_blockscale_gemm,
# one opaque op that quantizes its input inside (DeepGEMM at 32+ rows, FlashInfer's swapAB kernel below), so the
# passes found no rms_norm -> per_token_group_fp8_quant pair to fuse (part P: +0.3% / +1%, noise; cancelled after its
# first pairs). VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER=0 selects vLLM's DeepGEMM kernel, which quantizes with the
# QuantFP8 op in the graph, where rms_quant_fusion.py and act_quant_fusion.py have patterns for group 128 (column-major
# and TMA-aligned scales included). "nofi" alone separates the kernel switch from the fusion. Steady state at 192 in
# flight, then batches of the 600 for time and verdict flips; kept and nofi_fused twice, alternating.
profile: 27b
data: q38_dev600.jsonl
judges: [off_greedy_strict, think_medium_strict]
rungs:
  - name: steady_kept
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
  - name: steady_nofi
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
    env: {VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0}
  - name: steady_nofi_fused
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
    env: {VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0}
    set: {compilation-config: {"custom_ops": ["+rms_norm", "+silu_and_mul"], "pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}}}
  - name: steady_kept_again
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
  - name: steady_nofi_fused_again
    data: q38_dev.jsonl
    steady: {concurrency: 192, warmup: 90, seconds: 180}
    env: {VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0}
    set: {compilation-config: {"custom_ops": ["+rms_norm", "+silu_and_mul"], "pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}}}
  - name: kept
    objective: makespan
  - name: nofi_fused
    objective: makespan
    env: {VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0}
    set: {compilation-config: {"custom_ops": ["+rms_norm", "+silu_and_mul"], "pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}}}
  - name: kept_again
    objective: makespan
  - name: nofi_fused_again
    objective: makespan
    env: {VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0}
    set: {compilation-config: {"custom_ops": ["+rms_norm", "+silu_and_mul"], "pass_config": {"fuse_norm_quant": true, "fuse_act_quant": true}}}
