# Confirmation run, Flash-Next NVFP4 (two H100s): every candidate judge once on q38_dev2_confirm.jsonl (1,557
# development images not used so far, all with Sol labels; regular prompts only), on Flash ladder part A's winner
# (BF16 DeltaNet state, at most 64 sequences, no prefix caching). think_on = the baseline prompt at xhigh.
profile: experiments/qwen38/profiles/flash_nvfp4_start.yaml
data: q38_dev2_confirm.jsonl
judges: [off_greedy, think_medium_strict, think_xhigh_strict, think_on]
rungs:
  - name: final
    set: {enable-prefix-caching: null, no-enable-prefix-caching: true, mamba-ssm-cache-dtype: bfloat16,
          max-num-seqs: 64}
