# One Qwen3-VL-32B (BF16, ~62.6 GiB of weights) per 80 GB H100, sized for checklist judging:
# prompts + one 1024x1024 image stay well under 6k tokens, so a short context frees memory for the KV cache.
model: Qwen/Qwen3-VL-32B-Instruct
args:
  generation-config: vllm
  gpu-memory-utilization: 0.95
  max-model-len: 6144
  max-num-seqs: 64
  max-num-batched-tokens: 8192
  limit-mm-per-prompt: {"image": 1, "video": 0}
  mm-processor-kwargs: {"min_pixels": 16384, "max_pixels": 1048576}
  # vLLM 0.11's multimodal IPC cache can desynchronize under heavy image traffic and silently stop the
  # request loop; turning it off costs little because every image is sent once.
  mm-processor-cache-gb: 0
