# Quality mode for RL-sized steps (16-64 images at a time): the quality profile with n-gram drafts at every batch
# size. A step of 64 images is mostly tail, where drafts pay; with the thinking budget the median step is 54 s for
# 64 images and 24 s for 16 on one H100 (worst 80 s and 33 s), against 75 s and 42 s without drafts or budget
# (docs/serving.md). For large offline batches use "quality".
model: Qwen/Qwen3-VL-32B-Thinking-FP8
args:
  generation-config: vllm
  gpu-memory-utilization: 0.95
  max-model-len: 20480            # prompt + image (~1.5k tokens) + up to 16,384 tokens of reasoning and answer
  max-num-seqs: 128               # more in flight fills the KV cache and only queues
  max-num-batched-tokens: 8192
  limit-mm-per-prompt: {"image": 1, "video": 0}
  mm-processor-kwargs: {"min_pixels": 16384, "max_pixels": 1048576}
  mm-processor-cache-gb: 0
  kv-cache-dtype: fp8
  attention-backend: FLASHINFER
  async-scheduling: true
  reasoning-parser: qwen3         # the JSON schema applies to the answer after the reasoning
  # what the server writes when a request's thinking budget runs out (the quality judge sends 8,192 tokens): it ends
  # the reasoning and the model answers. Chains that loop stop there instead of at the output limit.
  reasoning-config: {"reasoning_end_str": "\n\nConsidering the limited time, I have to give the final answer based on my thinking so far.\n</think>\n\n"}
  speculative-config: {"method": "ngram_gpu", "num_speculative_tokens": 3, "prompt_lookup_min": 2,
                       "prompt_lookup_max": 5}
